name: Discord Server Cloner Bot

on:
  workflow_dispatch:   # Sirf manually trigger hoga

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run Server Cloner Bot
      env:
        TOKEN: ${{ secrets.MTUyMTY1NTIzMjEzMDQ1MzY0OQ.GZhE8K.NTvjaVvAE9NuqQ_dW7uwl0bTiONx8BcTCEdB3g }}
        ALLOWED_USER_IDS: ${{ secrets.1521655232130453649 }}
      run: |
        echo "🚀 Starting Discord Server Cloner Bot..."
        echo "🤖 Bot will now listen for !clone commands on Discord"
        node index.js
